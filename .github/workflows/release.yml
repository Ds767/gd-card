name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write      # 创建 / 更新 release
  id-token: write      # attestation 需要 OIDC token
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # 生成构建溯源证明，用户可 `gh attestation verify main.js --repo Ds767/gd-card`
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # 资产必须挂在 release 上，不能只是仓库里的文件
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "$GITHUB_REF_NAME" \
                 --verify-tag \
                 --generate-notes
          gh release upload "$GITHUB_REF_NAME" main.js manifest.json styles.css --clobber
